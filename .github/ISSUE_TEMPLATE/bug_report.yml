name: Bug report
description: Report a bug or issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what went wrong.
      placeholder: The visualizer does not reset after...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps needed to reproduce the issue.
      value: |
        1. Go to
        2. Click
        3. Observe
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if relevant.

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 123, Safari 17, Firefox 124...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: MacBook, iPhone, Android, Windows laptop...
    validations:
      required: true
