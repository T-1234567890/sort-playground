name: Feature request
description: Suggest an improvement or new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: Describe the feature clearly.
      placeholder: Add a way to compare two algorithms side by side...
    validations:
      required: true

  - type: textarea
    id: usefulness
    attributes:
      label: Why is this useful?
      description: Explain the benefit for users, contributors, or maintainers.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation
      description: Optional. How could it be implemented?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add mockups, links, related issues, or other notes.
