name: Sort Labs Season

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-season-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate event ranking data
        run: node scripts/generate-season-ranking.mjs

      - name: Upload season artifact
        uses: actions/upload-artifact@v4
        with:
          name: sort-labs-season
          path: public/data/event-ranking-*.json

      - name: Commit generated season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/event-ranking-*.json
          git diff --cached --quiet || git commit -m "chore: refresh Sort Labs season data"
          git push
