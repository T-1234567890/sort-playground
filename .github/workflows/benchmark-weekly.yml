name: Benchmark Weekly Full Run

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: benchmark-weekly-full
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_RUN_MODE: full

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark generation
        run: node scripts/benchmark/run.js

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking-weekly
          path: public/data/benchmark-ranking.json

      - name: Commit generated benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/benchmark-ranking.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: weekly benchmark refresh"
          git pull --rebase origin main
          git push origin HEAD:main
