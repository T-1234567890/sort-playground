name: Benchmark Direct Push

on:
  push:
    branches:
      - main
    paths:
      - "src/algorithms/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/benchmark-direct-push.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-direct-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run benchmark generation
        run: node scripts/generate-benchmark-ranking.mjs

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking-direct-push
          path: public/data/benchmark-ranking.json

      - name: Commit generated benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/benchmark-ranking.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh benchmark ranking data"
          git pull --rebase origin main
          git push origin HEAD:main
