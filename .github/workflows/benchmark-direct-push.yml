name: Benchmark Direct Push

on:
  push:
    branches:
      - main
    paths:
      - "src/algorithms/**"
      - "scripts/benchmark/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/benchmark-direct-push.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-direct-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      count: ${{ steps.generate-matrix.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate algorithm matrix
        id: generate-matrix
        run: |
          node scripts/benchmark/list-algorithms.js > algorithms.json
          COUNT=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("algorithms.json", "utf8")).length)')
          echo "matrix=$(cat algorithms.json)" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  generate-language-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      matrix: ${{ steps.generate-language-matrix.outputs.matrix }}
      count: ${{ steps.generate-language-matrix.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate language matrix
        id: generate-language-matrix
        run: |
          node scripts/benchmark/list-language-targets.js > language-targets.json
          COUNT=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("language-targets.json", "utf8")).length)')
          echo "matrix=$(cat language-targets.json)" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        algorithm: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        language: [python, rust, c]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark
        run: node scripts/benchmark/run.js
        env:
          ALGORITHM: ${{ matrix.algorithm.slug }}
          LANGUAGE: ${{ matrix.language }}
          BENCHMARK_RUN_MODE: small
          OUTPUT_PATH: benchmark-${{ matrix.algorithm.slug }}-${{ matrix.language }}.json

      - name: Upload partial benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.algorithm.slug }}-${{ matrix.language }}
          path: benchmark-${{ matrix.algorithm.slug }}-${{ matrix.language }}.json

  merge-results:
    needs: [generate-matrix, benchmark]
    if: always() && needs.generate-matrix.result == 'success' && (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download partial benchmark artifacts
        if: needs.generate-matrix.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          merge-multiple: true
          path: benchmark-results

      - name: Merge benchmark results
        run: node scripts/benchmark/merge-results.js
        env:
          BENCHMARK_RUN_MODE: small
          PARTIAL_RESULTS_DIR: benchmark-results

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking
          path: public/data/benchmark-ranking.json

  benchmark-languages:
    needs: generate-language-matrix
    if: needs.generate-language-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.generate-language-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run experimental language benchmark
        run: node scripts/benchmark/run-language.js
        env:
          ALGORITHM: ${{ matrix.target.slug }}
          LANGUAGE_CODE: ${{ matrix.target.languageCode }}
          BENCHMARK_RUN_MODE: small
          OUTPUT_PATH: community-language-${{ matrix.target.slug }}-${{ matrix.target.languageCode }}.json

      - name: Upload experimental benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-language-${{ matrix.target.slug }}-${{ matrix.target.languageCode }}
          path: community-language-${{ matrix.target.slug }}-${{ matrix.target.languageCode }}.json

  merge-language-results:
    needs: [generate-language-matrix, benchmark-languages, merge-results]
    if: always() && needs.merge-results.result == 'success' && needs.generate-language-matrix.result == 'success' && (needs.benchmark-languages.result == 'success' || needs.benchmark-languages.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download main benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-ranking
          path: benchmark-main

      - name: Restore main benchmark file
        run: cp benchmark-main/benchmark-ranking.json public/data/benchmark-ranking.json

      - name: Download experimental benchmark artifacts
        if: needs.generate-language-matrix.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: community-language-*
          merge-multiple: true
          path: benchmark-language-results

      - name: Merge experimental benchmark results
        run: node scripts/benchmark/merge-language-results.js
        env:
          PARTIAL_RESULTS_DIR: benchmark-language-results
          MAIN_BENCHMARK_PATH: benchmark-main/benchmark-ranking.json

      - name: Upload experimental benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-languages
          path: public/data/benchmark-languages.json

      - name: Commit generated benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/benchmark-ranking.json public/data/benchmark-languages.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh benchmark data"
          git pull --rebase origin main
          git push origin HEAD:main
