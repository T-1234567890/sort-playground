name: Events Ranking

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  discussions: read
  pull-requests: read

jobs:
  build-events-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate events ranking data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-events-ranking.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/event-ranking.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh events ranking data"
          git pull --rebase origin main
          git push origin HEAD:main
