name: Benchmark PR Validation

on:
  pull_request:
    paths:
      - "src/algorithms/**"
      - "scripts/benchmark/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/benchmark-direct-push.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        node-version: [22]
    env:
      BENCHMARK_RUN_MODE: small

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark generation
        run: node scripts/benchmark/run.js

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking
          path: public/data/benchmark-ranking.json
