name: Benchmark PR Validation

on:
  pull_request:
    paths:
      - "src/algorithms/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/benchmark-direct-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark generation
        run: node scripts/generate-benchmark-ranking.mjs

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking
          path: public/data/benchmark-ranking.json
