name: Benchmark Ranking

on:
  pull_request:
    paths:
      - "src/algorithms/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "src/algorithms/**"
      - "scripts/generate-benchmark-ranking.mjs"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run benchmark generation
        run: node scripts/generate-benchmark-ranking.mjs

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ranking
          path: public/data/benchmark-ranking.json

      - name: Commit generated benchmark data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/benchmark-ranking.json
          git diff --cached --quiet || git commit -m "chore: refresh benchmark ranking data"
          git push
